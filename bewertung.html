
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kundenbewertung – Toni's Automobile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: 35px auto;
    }

    h1 {
      color: #d4af37;
      text-align: center;
    }

    .panel {
      background: #1c1c1c;
      border: 1px solid #b8952e;
      border-radius: 12px;
      padding: 25px;
      margin-top: 25px;
    }

    p {
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 18px 0 7px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #777;
      background: #292929;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 20px 0;
      line-height: 1.5;
    }

    .consent input {
      width: auto;
      margin-top: 4px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #d4af37;
      color: #111;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back {
      display: block;
      text-align: center;
      color: #d4af37;
      margin-top: 25px;
      text-decoration: none;
    }

    #reviewMessage {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>⭐ Kundenbewertung</h1>

    <div class="panel">
      <p>
        Deine Meinung ist uns wichtig!
        Teile deine Erfahrung mit Toni's Automobile.
      </p>

      <form id="reviewForm">
        <label for="reviewName">Dein Name</label>
        <input
          id="reviewName"
          type="text"
          maxlength="80"
          required
        >

        <label for="reviewStars">Deine Bewertung</label>
        <select id="reviewStars" required>
          <option value="5">★★★★★ – Sehr gut</option>
          <option value="4">★★★★ – Gut</option>
          <option value="3">★★★ – Mittel</option>
          <option value="2">★★ – Schlecht</option>
          <option value="1">★ – Sehr schlecht</option>
        </select>

        <label for="reviewComment">Dein Kommentar</label>
        <textarea
          id="reviewComment"
          maxlength="1000"
          required
        ></textarea>

        <label class="consent">
          <input type="checkbox" id="reviewConsent" required>
          <span>
            Ich bin damit einverstanden, dass mein Name und meine
            Bewertung nach Prüfung öffentlich auf der Website von
            Toni's Automobile angezeigt werden.
          </span>
        </label>

        <button type="submit" id="submitButton">
          Bewertung absenden
        </button>

        <p id="reviewMessage" aria-live="polite"></p>
      </form>
    </div>

    <a class="back" href="index.html">
      ← Zurück zu Toni's Automobile
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const db = supabase.createClient(
      'https://ylgaecxpjpwcqckspfkq.supabase.co',
      'sb_publishable_4Hn0yxRkfGcezH9WCQCuIQ_-SQuKnJu'
    );

    document.getElementById('reviewForm')
      .addEventListener('submit', async event => {

        event.preventDefault();

        const message = document.getElementById('reviewMessage');
        const button = document.getElementById('submitButton');

        const name = document.getElementById('reviewName').value.trim();
        const comment = document.getElementById('reviewComment').value.trim();
        const stars = Number(document.getElementById('reviewStars').value);
        const consent = document.getElementById('reviewConsent').checked;

        if (!name || !comment || !consent) {
          message.textContent = 'Bitte fülle alle Felder aus und bestätige die Einwilligung.';
          return;
        }

        message.textContent = 'Bewertung wird gesendet ...';
        button.disabled = true;

        try {
          const { error } = await db
            .from('bewertungen')
            .insert({
              Name: name,
              Sterne: stars,
              Kommentar: comment,
              Freigeben: false,
              Einwilligung: consent
            });

          if (error) {
            throw error;
          }

          message.textContent =
            'Vielen Dank! Deine Bewertung wird nach Prüfung veröffentlicht.';

          event.target.reset();

        } catch (error) {
          message.textContent =
            'Fehler beim Senden: ' + error.message;
        } finally {
          button.disabled = false;
        }
      });
  </script>
</body>
</html>
